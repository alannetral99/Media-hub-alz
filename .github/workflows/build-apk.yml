name: Build MediaHub ALZ APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MediaHub_v0.3_GitHub_Build.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          test -f "MediaHub_v0.3_GitHub_Build.zip" || {
            echo "::error::MediaHub_v0.3_GitHub_Build.zip was not found in the repository root."
            exit 1
          }

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q "MediaHub_v0.3_GitHub_Build.zip" -d android-project
          SETTINGS_FILE="$(find android-project -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found in the ZIP archive."
            find android-project -maxdepth 5 -type f -print
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaHub-ALZ-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean temporary extracted project
        if: always()
        run: |
          rm -rf android-project
          echo "Temporary extraction directory cleaned."
          test -f "MediaHub_v0.3_GitHub_Build.zip" && echo "Original project ZIP preserved."
